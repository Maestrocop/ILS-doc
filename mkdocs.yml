site_name: ILS Documentation
site_url: https://yourusername.github.io/ILS-doc/
repo_url: https://github.com/yourusername/ILS-doc
repo_name: GitHub

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top

nav:
  - Home: index.md
  - Developer Guide: developer/DEVELOPER_WIKI.md
  - ILS Concepts:
      - concepts/ils-vs-lms.md
      - concepts/outcome-mastery.md
      - concepts/snapshot-lifecycle.md
      - concepts/trend-direction-confidence.md
      - concepts/at-risk-detection.md
      - concepts/heatmap-interpretation.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
